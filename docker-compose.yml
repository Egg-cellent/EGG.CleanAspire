services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: egg-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
